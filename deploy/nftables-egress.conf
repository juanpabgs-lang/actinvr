# Cortafuegos de anfitrión (complemento de la guardia del proceso).
# Solo deja salir al servidor del modelo en esta máquina. Finreg: esto no se
# sustituye por el parche de socket; se acumula.
#
# nft -f deploy/nftables-egress.conf

table inet onboarding {
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ip daddr 127.0.0.1 tcp dport 11434 accept
    ip6 daddr ::1 tcp dport 11434 accept
    ct state established,related accept
  }
}
